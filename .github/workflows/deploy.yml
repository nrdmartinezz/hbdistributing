name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload to cPanel
    runs-on: ubuntu-latest
    environment: production
    env:
      SITE_URL: ${{ secrets.SITE_URL || vars.SITE_URL }}
      # Early production. Flip this to the environment variable when the site should be indexed.
      ALLOW_INDEXING: 'false'
    steps:
      - name: Check deploy settings
        env:
          FTP_HOST_RAW: ${{ secrets.FTP_HOST || secrets.FTP_SERVER }}
          FTP_USER_RAW: ${{ secrets.FTP_USER || secrets.FTP_USERNAME }}
          FTP_PW_RAW: ${{ secrets.FTP_PW || secrets.FTP_PASSWORD }}
          FTP_DIR_RAW: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: |
          trim() {
            printf '%s' "$1" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          host=$(trim "$FTP_HOST_RAW")
          host="${host#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"
          user=$(trim "$FTP_USER_RAW")
          pass=$(trim "$FTP_PW_RAW")
          dir=$(trim "$FTP_DIR_RAW")
          if [ -z "$dir" ]; then dir="./"; fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac

          missing=0
          if [ -z "$host" ]; then
            echo "::error title=Missing FTP host::The production environment needs an FTP_HOST secret."
            missing=1
          fi
          if [ -z "$user" ]; then
            echo "::error title=Missing FTP user::The production environment needs an FTP_USER secret."
            missing=1
          fi
          if [ -z "$pass" ]; then
            echo "::error title=Missing FTP password::The production environment needs an FTP_PW secret."
            missing=1
          fi
          if [ -z "$SITE_URL" ]; then
            echo "::error title=Missing SITE_URL::The production environment needs a SITE_URL variable or secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit "$missing"
          fi

          {
            echo "FTP_HOST<<EOF_HOST"
            echo "$host"
            echo "EOF_HOST"
            echo "FTP_USER<<EOF_USER"
            echo "$user"
            echo "EOF_USER"
            echo "FTP_PW<<EOF_PW"
            echo "$pass"
            echo "EOF_PW"
            echo "FTP_DIR<<EOF_DIR"
            echo "$dir"
            echo "EOF_DIR"
          } >> "$GITHUB_ENV"

          echo "Production settings found. Indexing is off."
          echo "SITE_URL=$SITE_URL"
          echo "FTP path: $dir"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Gate: a type error or malformed frontmatter must never reach the server.
      - run: npm run verify

      - name: Install PHPMailer
        run: composer install --no-dev --working-dir=public/api

      - run: npm run build

      - name: FTP deploy
        id: ftps
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PW }}
          protocol: ftps
          security: loose
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**

      # Some cPanel accounts reject FTPS with 530 and accept plain FTP on port 21.
      - name: FTP deploy over plain FTP
        if: steps.ftps.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.FTP_HOST }}
          username: ${{ env.FTP_USER }}
          password: ${{ env.FTP_PW }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ env.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            cgi-bin/**
